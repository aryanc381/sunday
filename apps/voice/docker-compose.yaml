# Local development only. devkey and secret are LiveKit's public dev keys; never use them on a server.
# Based on the official file: https://github.com/livekit/sip/blob/main/docker-compose.yaml
# LiveKit and SIP use host networking. On Docker Desktop for Mac, turn on Settings > Resources > Network > Enable host networking.
services:
  mongo:
    image: mongo:7
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.4.12-alpine
    ports:
      - 6379:6379

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --dev --redis-host localhost:6379
    network_mode: host
    depends_on:
      - redis

  sip:
    image: livekit/sip:v1.23.0
    network_mode: host
    depends_on:
      - redis
      - livekit
    environment:
      SIP_CONFIG_BODY: |
        api_key: 'devkey'
        api_secret: 'secret'
        ws_url: 'ws://localhost:7880'
        redis:
          address: 'localhost:6379'
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: info

volumes:
  mongo-data:
