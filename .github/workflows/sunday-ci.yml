name: sunday-ci

on:
  push:
    paths:
      - 'sunday/**'
      - '.github/workflows/sunday-ci.yml'
  pull_request:
    paths:
      - 'sunday/**'
      - '.github/workflows/sunday-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sunday/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
